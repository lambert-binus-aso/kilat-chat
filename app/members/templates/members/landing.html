<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KilatChat — Get started</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #f7f7fb; color: #1b1b25; }
    main { width: min(100%, 440px); background: white; padding: 36px; border: 1px solid #e7e6ee; border-radius: 20px; box-shadow: 0 12px 35px #2420410a; }
    h1 { font-size: 32px; margin: 0 0 10px; }
    p { color: #666477; margin: 0 0 28px; line-height: 1.5; }
    label { display: block; font-weight: 600; margin: 16px 0 7px; }
    input { width: 100%; border: 1px solid #c8c6d3; border-radius: 10px; padding: 12px 14px; font: inherit; }
    input:focus { outline: 2px solid #8b70e3; outline-offset: 1px; }
    button { width: 100%; margin-top: 26px; padding: 13px; border: 0; border-radius: 10px; background: #6843d4; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    .errorlist { color: #a32037; padding-left: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to KilatChat</h1>
    <p>Create your profile to get started.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label for="{{ form.username.id_for_label }}">Username</label>
      {{ form.username }}
      {{ form.username.errors }}
      <label for="{{ form.email.id_for_label }}">Email</label>
      {{ form.email }}
      {{ form.email.errors }}
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
